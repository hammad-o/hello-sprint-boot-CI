name: Hello Spring Boot App to Docker

on:
  push

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup JDK
            uses: actions/setup-java@v5
            with:
                distribution: 'temurin'
                java-version: '21'

          - name: Build and Test(Maven)
            working-directory: docker/hello-spring
            run: mvn -B clean verify

          - name: Upload Test Reports
            uses: actions/upload-artifact@v4
            with:
                name: test-reports
                path: docker/hello-spring/target/surefire-reports

    
    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup JDK
            uses: actions/setup-java@v5
            with:
                distribution: 'temurin'
                java-version: '21'

          - name: Build JAR for Docker
            working-directory: docker/hello-spring
            run: mvn -B clean package -DskipTests

          - name: Login to DockerHub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

          - name: Build and Push Docker Image
            uses: docker/build-push-action@v6
            with:
                context: docker/hello-spring
                push: true
                tags: |
                  ${{ secrets.DOCKERHUB_USERNAME }}/hello-spring:latest
                  ${{ secrets.DOCKERHUB_USERNAME }}/hello-spring:${{ github.sha }}